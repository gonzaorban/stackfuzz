[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "stackfuzz"
version = "0.1.0"
description = "Un envoltorio de ffuf consciente del stack: detecta el stack tecnológico de un objetivo web y lo fuzzea con wordlists curadas."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "gonzaorban" }]
dependencies = ["httpx"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
stackfuzz = "stackfuzz.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["stackfuzz"]
include-package-data = true

[tool.setuptools.package-data]
stackfuzz = ["wordlists/*.txt"]
